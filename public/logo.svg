<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB"/>
      <stop offset="50%" stop-color="#C8951E"/>
      <stop offset="100%" stop-color="#8A5C0A"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1A1410"/>
      <stop offset="100%" stop-color="#0A0603"/>
    </radialGradient>
  </defs>
  
  <!-- Outer Frame -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#gold)" stroke-width="8" opacity="0.6"/>
  
  <!-- Sankofa Bird Emblem Representation -->
  <g transform="translate(156, 120) scale(2.0)">
    <!-- Body & Curved Neck turning back -->
    <path d="M 50,40 C 30,10 70,0 80,25 C 85,38 75,50 60,48 C 52,47 48,38 55,30 C 60,25 68,26 65,32 C 63,35 58,35 58,32 C 58,30 61,28 64,30" fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round"/>
    
    <!-- Egg in beak -->
    <circle cx="78" cy="22" r="5" fill="url(#gold)"/>
    
    <!-- Wing Tail Flourish -->
    <path d="M 50,40 C 40,60 20,70 10,65 C 25,60 38,52 48,42" fill="url(#gold)" opacity="0.9"/>
    <path d="M 50,40 C 45,65 30,80 15,80 C 30,72 42,62 49,45" fill="url(#gold)" opacity="0.8"/>
    
    <!-- Heart Base -->
    <path d="M 50,45 Q 65,70 50,90 Q 35,70 50,45 Z" fill="url(#gold)"/>
  </g>

  <!-- KÈNÈ Text -->
  <text x="256" y="440" text-anchor="middle" font-family="'Questrial', sans-serif" font-weight="900" font-size="52" fill="url(#gold)" letter-spacing="12">KÈNÈ</text>
  <text x="256" y="475" text-anchor="middle" font-family="monospace" font-size="18" fill="#F3E5AB" opacity="0.6" letter-spacing="6">DERMO-COSMÉTIQUE</text>
</svg>
